name: Release Signed APK & AAB

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (ör. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release & Publish
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Decode Firebase and signing secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_APPLET_CONFIG_XML_BASE64: ${{ secrets.FIREBASE_APPLET_CONFIG_XML_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ] || [ -z "$FIREBASE_APPLET_CONFIG_XML_BASE64" ] || [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing required release secrets (GOOGLE_SERVICES_JSON_BASE64, FIREBASE_APPLET_CONFIG_XML_BASE64, RELEASE_KEYSTORE_BASE64)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          echo "$FIREBASE_APPLET_CONFIG_XML_BASE64" | base64 --decode > app/src/main/res/values/firebase_applet_config.xml
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Prepare versioned release files
        run: |
          VERSION_TAG="${{ inputs.tag_name || github.ref_name }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/RainCube-${VERSION_TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/RainCube-${VERSION_TAG}.aab"

      - name: Upload Release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rain-cube-release-artifacts
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" dist/* --clobber
          else
            gh release create "$VERSION_TAG" dist/* \
              --title "Rain Cube $VERSION_TAG" \
              --generate-notes
          fi
