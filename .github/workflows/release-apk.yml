name: Release APK & AAB

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v0.1.0-infra'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode Firebase and signing secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_APPLET_CONFIG_XML_BASE64: ${{ secrets.FIREBASE_APPLET_CONFIG_XML_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ] || [ -z "$FIREBASE_APPLET_CONFIG_XML_BASE64" ] || [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing required release secrets (GOOGLE_SERVICES_JSON_BASE64, FIREBASE_APPLET_CONFIG_XML_BASE64, RELEASE_KEYSTORE_BASE64)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          echo "$FIREBASE_APPLET_CONFIG_XML_BASE64" | base64 --decode > app/src/main/res/values/firebase_applet_config.xml
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rain-cube-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
