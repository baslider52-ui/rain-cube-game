name: Android CI & GitHub APK Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test & Build Rain Cube APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare Firebase and signing configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_APPLET_CONFIG_XML: ${{ secrets.FIREBASE_APPLET_CONFIG_XML }}
          FIREBASE_APPLET_CONFIG_XML_BASE64: ${{ secrets.FIREBASE_APPLET_CONFIG_XML_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Wrote app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Decoded app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          else
            echo "Info: GOOGLE_SERVICES_JSON secret not set; building without Firebase config."
          fi

          if [ -n "$FIREBASE_APPLET_CONFIG_XML" ]; then
            printf '%s\n' "$FIREBASE_APPLET_CONFIG_XML" > app/src/main/res/values/firebase_applet_config.xml
            echo "Wrote firebase_applet_config.xml from FIREBASE_APPLET_CONFIG_XML secret."
          elif [ -n "$FIREBASE_APPLET_CONFIG_XML_BASE64" ]; then
            echo "$FIREBASE_APPLET_CONFIG_XML_BASE64" | base64 --decode > app/src/main/res/values/firebase_applet_config.xml
            echo "Decoded firebase_applet_config.xml from FIREBASE_APPLET_CONFIG_XML_BASE64 secret."
          else
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ci-placeholder-db</string>
          </resources>
          EOF
            echo "Info: FIREBASE_APPLET_CONFIG_XML not set; using placeholder firestore_database_id for CI build."
          fi

          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "Decoded debug.keystore from GitHub Secret."
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Info: Generated ephemeral debug.keystore for CI build."
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --tests 'com.example.ExampleUnitTest' --tests 'com.example.ExampleRobolectricTest' --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare downloadable APK file
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RainCube-android.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: rain-cube-apk
          path: dist/RainCube-android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download on GitHub Releases (latest)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/RainCube-android.apk --clobber
          else
            gh release create latest dist/RainCube-android.apk \
              --title "Rain Cube — Son Sürüm APK" \
              --notes "Rain Cube Android uygulamasının otomatik derlenmiş en güncel APK dosyası. Doğrudan RainCube-android.apk dosyasını indirip Android cihazınıza kurabilirsiniz." \
              --prerelease
          fi

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-ci-failure-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
