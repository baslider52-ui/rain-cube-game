name: Android CI & GitHub APK Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test & Build Rain Cube APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Firebase configuration files
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_APPLET_CONFIG_XML_BASE64: ${{ secrets.FIREBASE_APPLET_CONFIG_XML_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secret."
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret not set; building with MissingGoogleServicesStrategy.WARN"
          fi

          if [ -n "$FIREBASE_APPLET_CONFIG_XML_BASE64" ]; then
            echo "$FIREBASE_APPLET_CONFIG_XML_BASE64" | base64 --decode > app/src/main/res/values/firebase_applet_config.xml
            echo "Decoded firebase_applet_config.xml from GitHub Secret."
          else
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ci-placeholder-db</string>
          </resources>
          EOF
            echo "::warning::FIREBASE_APPLET_CONFIG_XML_BASE64 secret not set; using placeholder firestore_database_id for CI build."
          fi

      - name: Run unit tests (non-emulator)
        run: gradle :app:testDebugUnitTest --tests 'com.example.ExampleUnitTest' --tests 'com.example.ExampleRobolectricTest' --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare downloadable APK file
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RainCube-android.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rain-cube-apk
          path: dist/RainCube-android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download on GitHub Releases (latest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Rain Cube — Son Sürüm APK
          body: |
            Rain Cube Android uygulamasının `main` dalından otomatik derlenmiş en güncel APK dosyası.
            Doğrudan **RainCube-android.apk** dosyasını indirip Android cihazınıza kurabilirsiniz.
          prerelease: true
          make_latest: true
          files: dist/RainCube-android.apk

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-failure-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
