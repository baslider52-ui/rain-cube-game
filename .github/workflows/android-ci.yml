name: Android CI & GitHub APK Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_override:
        description: 'İsteğe bağlı sürüm (ör. v1.1.0). Boş bırakılırsa otomatik artar.'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Test & Build Rain Cube APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Restore consistent CI signing keystore
        uses: actions/cache@v6
        with:
          path: debug.keystore
          key: rain-cube-signing-keystore-v1

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          source version.properties
          MAJOR="${VERSION_MAJOR:-1}"
          MINOR="${VERSION_MINOR:-0}"
          BASE_PATCH="${VERSION_PATCH:-1}"

          CLEAN_OVERRIDE="${VERSION_OVERRIDE#v}"
          if [[ "$CLEAN_OVERRIDE" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            NEXT_PATCH="${BASH_REMATCH[3]}"
          else
            EXISTING_TAGS="$(git tag -l "v${MAJOR}.${MINOR}.*" 2>/dev/null || true)"
            GH_TAGS="$(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null || true)"
            ALL_TAGS="$(printf '%s\n%s\n' "$EXISTING_TAGS" "$GH_TAGS" | grep -E "^v${MAJOR}\.${MINOR}\.[0-9]+$" || true)"

            MAX_PATCH=-1
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              patch="${tag##*.}"
              if [ "$patch" -gt "$MAX_PATCH" ] 2>/dev/null; then
                MAX_PATCH="$patch"
              fi
            done <<< "$ALL_TAGS"

            if [ "$MAX_PATCH" -ge "$BASE_PATCH" ]; then
              NEXT_PATCH=$((MAX_PATCH + 1))
            else
              NEXT_PATCH="$BASE_PATCH"
            fi
          fi

          VERSION_NAME="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          VERSION_TAG="v${VERSION_NAME}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + NEXT_PATCH))

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${VERSION_TAG} (versionCode=${VERSION_CODE})"

      - name: Prepare Firebase and consistent signing keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_APPLET_CONFIG_XML: ${{ secrets.FIREBASE_APPLET_CONFIG_XML }}
          FIREBASE_APPLET_CONFIG_XML_BASE64: ${{ secrets.FIREBASE_APPLET_CONFIG_XML_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase JSON secret loaded."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > app/google-services.json
            echo "Firebase JSON base64 secret decoded."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret is NOT set; Firebase Auth/Firestore will be inactive in this APK."
          fi

          if [ -f app/google-services.json ]; then
            python3 -m json.tool app/google-services.json > /dev/null
          fi

          if [ -n "$FIREBASE_APPLET_CONFIG_XML" ]; then
            printf '%s\n' "$FIREBASE_APPLET_CONFIG_XML" > app/src/main/res/values/firebase_applet_config.xml
            echo "Firebase XML secret loaded."
          elif [ -n "$FIREBASE_APPLET_CONFIG_XML_BASE64" ]; then
            printf '%s' "$FIREBASE_APPLET_CONFIG_XML_BASE64" | tr -d '[:space:]' | base64 --decode > app/src/main/res/values/firebase_applet_config.xml
            echo "Firebase XML base64 secret decoded."
          else
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ci-placeholder-db</string>
          </resources>
          EOF
            echo "::warning::FIREBASE_APPLET_CONFIG_XML not set; using placeholder firestore_database_id for CI build."
          fi

          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > debug.keystore
            echo "Loaded consistent signing keystore from GitHub Secret."
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Rain Cube,O=RainCube,C=TR"
            echo "Initialized shared CI debug.keystore for consistent APK signing."
          else
            echo "Reusing cached debug.keystore for identical APK signing identity."
          fi

      - name: Run unit tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests 'com.example.ExampleUnitTest' \
            --tests 'com.example.ExampleRobolectricTest' \
            --tests 'com.example.RainCubeEngineTest' \
            --tests 'com.example.GitHubUpdateCheckerTest' \
            -PappVersionName="${{ steps.version.outputs.version_name }}" \
            -PappVersionCode="${{ steps.version.outputs.version_code }}" \
            -PgithubRepoSlug="${{ github.repository }}" \
            --stacktrace

      - name: Build Versioned APK
        run: |
          gradle :app:assembleDebug \
            -PappVersionName="${{ steps.version.outputs.version_name }}" \
            -PappVersionCode="${{ steps.version.outputs.version_code }}" \
            -PgithubRepoSlug="${{ github.repository }}" \
            --stacktrace

      - name: Prepare downloadable APK and announcement notes
        env:
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          mkdir -p dist
          APK_FILE="dist/RainCube-${VERSION_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"

          PREV_TAG="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1 || true)"
          if [ -n "$PREV_TAG" ]; then
            CHANGES="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' --no-merges | head -n 15 || true)"
          else
            CHANGES="$(git log -n 5 --pretty=format:'- %s' --no-merges || true)"
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES="- Performans, kararlılık ve altyapı iyileştirmeleri."
          fi

          RELEASE_DATE="$(TZ='Europe/Istanbul' date '+%d.%m.%Y %H:%M')"

          cat << EOF > dist/release_notes.md
          ## 🎮 Rain Cube ${VERSION_TAG} Yayınlandı!

          **Sürüm:** \`${VERSION_NAME}\` (Derleme \`${VERSION_CODE}\`)
          **Yayın Tarihi:** ${RELEASE_DATE}

          ### 📰 Bu Sürümdeki Yenilikler
          ${CHANGES}

          ---

          ### 📱 Android Cihaza Kurulum
          1. Aşağıdaki **Assets** bölümünden **\`RainCube-${VERSION_TAG}.apk\`** dosyasını indirin.
          2. İndirilen APK dosyasına dokunup kurulumu onaylayın.
          3. Uygulamayı açın ve **Google hesabınızla** giriş yaparak devam edin.
          EOF

      - name: Remove old workflow APK artifacts
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_IDS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("rain-cube-")) | .id' 2>/dev/null || true)"
          for aid in $OLD_IDS; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}" >/dev/null 2>&1 || true
          done

      - name: Upload newest APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: rain-cube-latest-apk
          path: dist/RainCube-${{ steps.version.outputs.version_tag }}.apk
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Publish newest Release and delete older GitHub Releases
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          APK_FILE="dist/RainCube-${VERSION_TAG}.apk"
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" "$APK_FILE" --clobber
            gh release edit "$VERSION_TAG" \
              --title "Rain Cube ${VERSION_TAG}" \
              --notes-file dist/release_notes.md \
              --latest
          else
            gh release create "$VERSION_TAG" "$APK_FILE" \
              --target "${GITHUB_SHA}" \
              --title "Rain Cube ${VERSION_TAG}" \
              --notes-file dist/release_notes.md \
              --latest
          fi

          OLD_RELEASES="$(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null || true)"
          while IFS= read -r old_tag; do
            [ -z "$old_tag" ] && continue
            [ "$old_tag" = "$VERSION_TAG" ] && continue
            echo "Deleting previous release: $old_tag"
            gh release delete "$old_tag" --yes || true
          done <<< "$OLD_RELEASES"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-ci-failure-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
